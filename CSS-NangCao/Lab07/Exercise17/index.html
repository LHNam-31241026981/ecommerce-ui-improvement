<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Exercise 7.17 · Filters</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>CSS image filters</h1>
      <p>Each tile applies a different filter; hover or keyboard-focus a tile to reveal the unfiltered original.</p>
      <section>
        <figure tabindex="0">
          <img alt="Self Portrait in a Straw Hat — original" src="../images/Lebrun.jpg">
          <figcaption>Original</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="saturate" alt="Saturated portrait" src="../images/Lebrun.jpg">
          <figcaption>saturate(3)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="grayscale" alt="Grayscale portrait" src="../images/Lebrun.jpg">
          <figcaption>grayscale(100%)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="contrast" alt="High contrast portrait" src="../images/Lebrun.jpg">
          <figcaption>contrast(160%)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="brightness" alt="Darkened portrait" src="../images/Lebrun.jpg">
          <figcaption>brightness(30%)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="blur" alt="Blurred portrait" src="../images/Lebrun.jpg">
          <figcaption>blur(3px)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="invert" alt="Inverted portrait" src="../images/Lebrun.jpg">
          <figcaption>invert(100%)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="sepia" alt="Sepia portrait" src="../images/Lebrun.jpg">
          <figcaption>sepia(100%)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="hue" alt="Hue-shifted portrait" src="../images/Lebrun.jpg">
          <figcaption>hue-rotate(90deg)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="opacity" alt="Faded portrait" src="../images/Lebrun.jpg">
          <figcaption>opacity(50%)</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="combo-one" alt="Combined warm portrait filters" src="../images/Lebrun.jpg">
          <figcaption>Sepia + contrast</figcaption>
        </figure>
        <figure tabindex="0">
          <img class="combo-two" alt="Combined monochrome portrait filters" src="../images/Lebrun.jpg">
          <figcaption>Grayscale + contrast</figcaption>
        </figure>
      </section>
    </main>
    <p class="lab-return">
      <a href="../index.html">Back to Lab 7 index</a>
    </p>
  </body>
</html>
